name: Reconstruct exact v22 portfolio

on:
  push:
    branches: [v22-payload-check]
    paths:
      - '.github/workflows/reconstruct-v22.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v22-payload-check
          fetch-depth: 0

      - name: Reconstruct and verify exact v22
        shell: bash
        run: |
          set -euo pipefail
          cat deploy-parts/part*.b64 | base64 -d | xz -d > index.new.html
          echo "bytes=$(wc -c < index.new.html)"
          sha256sum index.new.html
          grep -q 'Zain Hing | Mechanical Engineering Portfolio' index.new.html
          grep -q 'Mechanical Engineering @ McMaster University' index.new.html
          echo '9b73d339baf71f6e115a67b9e8b2abe6e8665799d1e316f1f0e0d06852d56223  index.new.html' | sha256sum -c -

      - name: Commit exact v22 to preview branch
        shell: bash
        run: |
          set -euo pipefail
          mv index.new.html index.html
          rm -rf deploy-parts v22-assets .github/workflows/reconstruct-v22.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy exact final v22 portfolio'
          git push origin HEAD:v22-payload-check
