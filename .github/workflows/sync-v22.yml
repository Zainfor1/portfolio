name: Sync final v22 portfolio

on:
  push:
    paths:
      - '.github/workflows/sync-v22.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Diagnose Vercel share access
        shell: bash
        run: |
          set -u
          rm -f cookies.txt index.new.html
          curl --verbose --location \
            --cookie-jar cookies.txt --cookie cookies.txt \
            --user-agent 'Mozilla/5.0' \
            'https://zainhing-ms43gf7py-zains-projects-0de7bb63.vercel.app/?_vercel_share=MkJPHjphIVBLx1NV2Wp0rVpfDT87F2UJ' \
            --output index.new.html
          echo '--- downloaded bytes ---'
          wc -c index.new.html || true
          echo '--- first 800 chars ---'
          head -c 800 index.new.html || true
          echo
          echo '--- cookies ---'
          cat cookies.txt || true
          grep -q 'Zain Hing | Mechanical Engineering Portfolio' index.new.html

      - name: Commit final portfolio to main
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Mechanical Engineering @ McMaster University' index.new.html
          mv index.new.html index.html
          rm -f cookies.txt .github/workflows/sync-v22.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/sync-v22.yml
          git commit -m 'Deploy final v22 portfolio'
          git push origin HEAD:main
